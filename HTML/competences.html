<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compétences - Portfolio POURNY J.</title>
    <link rel="stylesheet" href="../CSS/style_comp.css">
    <link rel="icon" type="image/x-icon" href="../Images/Logos/outils-dedition.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Clarity+City:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>

    <input type="hidden" value="1" id="current_page">

    <!-- Panneau de navigation -->

    <div id="side_nav"></div>

    <!-- Contenu principal -->

    <div id="contents">

        <div id="title_div">
            <h1 id="title">Compétences</h1>
            <div id="title_underline"></div>
        </div>

        <div id="elements">

            <div class="div_name">
                <img src="../Images/Logos/internet.png" alt="Web" class="img_type">
                <h2 class="txt_type">Web</h2>
            </div>

            <div class="type_div">
                <div class="comp_div">
                    <img class="comp_img" src="../Images/Logos/HTML.png" alt="HTML">
                    <h3 class="comp_txt">HTML</h3>
                </div>
                <div class="comp_div">
                    <img class="comp_img" src="../Images/Logos/CSS.png" alt="CSS">
                    <h3 class="comp_txt">CSS</h3>
                </div>
                <div class="comp_div">
                    <img class="comp_img" src="../Images/Logos/JavaScript.png" alt="Javascript">
                    <h3 class="comp_txt">Javascript</h3>
                </div>
                <div class="comp_div">
                    <img class="comp_img" src="../Images/Logos/PHP.png" alt="PHP">
                    <h3 class="comp_txt">PHP</h3>
                </div>
            </div>

            <div class="div_name">
                <img src="../Images/Logos/webpage.png" alt="Applications" class="img_type">
                <h2 class="txt_type">Applications</h2>
            </div>

            <div class="type_div">
                <div class="comp_div">
                    <img class="comp_img" src="../Images/Logos/Java.png" alt="Java">
                    <h3 class="comp_txt">Java</h3>
                </div>
                <div class="comp_div">
                    <img class="comp_img" src="../Images/Logos/Python.png" alt="Python">
                    <h3 class="comp_txt">Python</h3>
                </div>
            </div>

            <div class="div_name">
                <img src="../Images/Logos/script.png" alt="Scripting" class="img_type">
                <h2 class="txt_type">Scripting</h2>
            </div>

            <div class="type_div">
                <div class="comp_div">
                    <img class="comp_img" src="../Images/Logos/Linux.png" alt="Bash">
                    <h3 class="comp_txt">Bash</h3>
                </div>
                <div class="comp_div">
                    <img class="comp_img" src="../Images/Logos/Powershell.png" alt="Powershell">
                    <h3 class="comp_txt">Powershell</h3>
                </div>
            </div>

            <div class="div_name">
                <img src="../Images/Logos/menu.png" alt="Autres" class="img_type">
                <h2 class="txt_type">Autres</h2>
            </div>

            <div class="type_div">
                <div class="comp_div">
                    <img class="comp_img" src="../Images/Logos/SQL.png" alt="SQL">
                    <h3 class="comp_txt">SQL</h3>
                </div>
            </div>

        </div>

    </div>

    <script src="../JS/side_nav.js"></script>
</body>
</html>
